[config]

# Гармонизированные ANSI-цвета для терминала (подмешиваются к акценту обоев)
[config.custom_colors]
red     = { color = "#f2495c", blend = true }
green   = { color = "#6fcf7a", blend = true }
yellow  = { color = "#e8c547", blend = true }
blue    = { color = "#5c9dff", blend = true }
magenta = { color = "#c678dd", blend = true }
cyan    = { color = "#4fd1c5", blend = true }

[templates.quickshell]
input_path  = '~/.config/matugen/templates/colors.json'
output_path = '~/.local/state/material/colors.json'

[templates.niri]
input_path  = '~/.config/matugen/templates/niri.kdl'
output_path = '~/.config/niri/colors.kdl'

[templates.ghostty]
input_path  = '~/.config/matugen/templates/ghostty-colors'
output_path = '~/.config/ghostty/colors'

[templates.gtk3]
input_path  = '~/.config/matugen/templates/gtk.css'
output_path = '~/.config/gtk-3.0/colors.css'

[templates.gtk4]
input_path  = '~/.config/matugen/templates/gtk.css'
output_path = '~/.config/gtk-4.0/colors.css'
